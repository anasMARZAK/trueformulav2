<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F2EFE9" />
    </linearGradient>
    <linearGradient id="tubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F3F30" />
      <stop offset="50%" stop-color="#2E5A44" />
      <stop offset="100%" stop-color="#1A3427" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C875" />
      <stop offset="100%" stop-color="#B89628" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111827" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <circle cx="300" cy="300" r="230" fill="#EAF2ED" opacity="0.6" />

  <!-- Outer Decorative Ring -->
  <circle cx="300" cy="300" r="210" fill="none" stroke="#2E5A44" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Tub Shadow & Base -->
  <g filter="url(#shadow)">
    <!-- Tub Lid -->
    <rect x="200" y="120" width="200" height="40" rx="8" fill="#111827" />
    <rect x="210" y="150" width="180" height="15" fill="#2E5A44" />
    <!-- Tub Body -->
    <path d="M 210 165 L 390 165 C 400 165 405 175 405 185 L 395 440 C 395 455 380 465 365 465 L 235 465 C 220 465 205 455 205 440 L 195 185 C 195 175 200 165 210 165 Z" fill="url(#tubGrad)" />
  </g>

  <!-- Apothecary Label -->
  <rect x="220" y="210" width="160" height="210" rx="4" fill="#FDFBF7" stroke="url(#goldAccent)" stroke-width="2" />
  <rect x="225" y="215" width="150" height="200" fill="none" stroke="#2E5A44" stroke-width="1" opacity="0.4" />

  <!-- Label Header -->
  <text x="300" y="240" font-family="Georgia, serif" font-size="10" fill="#2E5A44" text-anchor="middle" letter-spacing="2">PROTEINSHOP APOTHECARY</text>
  <line x1="240" y1="248" x2="360" y2="248" stroke="#D4AF37" stroke-width="1" />

  <!-- Title -->
  <text x="300" y="275" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">PURE ISOLATE</text>
  <text x="300" y="295" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2E5A44" text-anchor="middle">Whey Protein</text>

  <!-- Spec Badge -->
  <rect x="250" y="315" width="100" height="30" rx="15" fill="#EAF2ED" />
  <text x="300" y="335" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2E5A44" text-anchor="middle">26g PROTEIN</text>

  <!-- Botanical Emblem -->
  <path d="M 300 360 C 290 350 280 365 300 380 C 320 365 310 350 300 360 Z" fill="#2E5A44" />
  <text x="300" y="402" font-family="sans-serif" font-size="8" fill="#6B7280" text-anchor="middle" letter-spacing="1">NATIVE FORMULATION</text>
</svg>
