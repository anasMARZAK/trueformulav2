<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#EAF2ED" />
    </linearGradient>
    <linearGradient id="plantTubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#284838" />
      <stop offset="50%" stop-color="#3A6650" />
      <stop offset="100%" stop-color="#1E382B" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111827" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad5)" />
  <circle cx="300" cy="300" r="230" fill="#EAF2ED" opacity="0.8" />

  <!-- Tub Shadow & Base -->
  <g filter="url(#shadow5)">
    <!-- Tub Lid -->
    <rect x="200" y="130" width="200" height="38" rx="8" fill="#1B3327" />
    <!-- Tub Body -->
    <path d="M 210 170 L 390 170 C 400 170 405 180 405 190 L 395 440 C 395 455 380 465 365 465 L 235 465 C 220 465 205 455 205 440 L 195 190 C 195 180 200 170 210 170 Z" fill="url(#plantTubGrad)" />
  </g>

  <!-- Apothecary Label -->
  <rect x="220" y="215" width="160" height="210" rx="4" fill="#FDFBF7" stroke="#2E5A44" stroke-width="1.5" />
  
  <text x="300" y="242" font-family="Georgia, serif" font-size="9" fill="#2E5A44" text-anchor="middle" letter-spacing="1.5">ORGANIC BOTANICALS</text>
  <line x1="240" y1="250" x2="360" y2="250" stroke="#D4AF37" stroke-width="1" />

  <text x="300" y="278" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">PLANT PROTEIN</text>
  <text x="300" y="298" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#2E5A44" text-anchor="middle">Fermented Blend</text>

  <rect x="245" y="318" width="110" height="28" rx="14" fill="#EAF2ED" />
  <text x="300" y="336" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2E5A44" text-anchor="middle">100% VEGAN</text>

  <!-- Leaf SVG motif -->
  <path d="M 300 360 C 285 375 285 400 300 405 C 315 400 315 375 300 360 Z" fill="#2E5A44" />
</svg>
