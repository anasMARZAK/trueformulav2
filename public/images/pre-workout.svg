    <rect x="220" y="160" width="160" height="35" rx="6" fill="#111827" />
    <path d="M 225 195 L 375 195 C 385 195 390 205 390 215 L 385 430 C 385 442 375 450 360 450 L 240 450 C 225 450 215 442 215 430 L 210 215 C 210 205 215 195 225 195 Z" fill="url(#preGrad)" />
  </g>

  <!-- Label -->
  <rect x="235" y="230" width="130" height="190" rx="4" fill="#FDFBF7" stroke="#AD4A38" stroke-width="1.5" />
  
  <text x="300" y="255" font-family="Georgia, serif" font-size="9" fill="#AD4A38" text-anchor="middle" letter-spacing="1.5">BIO-ENERGY ELIXIR</text>
  <line x1="250" y1="262" x2="350" y2="262" stroke="#D4AF37" stroke-width="1" />

  <text x="300" y="290" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">PRE-WORKOUT</text>
  <text x="300" y="310" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#AD4A38" text-anchor="middle">Clean Ignition</text>

