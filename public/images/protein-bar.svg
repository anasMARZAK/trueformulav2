<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#EAF2ED" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D231E" />
      <stop offset="100%" stop-color="#191310" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111827" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad4)" />
  <circle cx="300" cy="300" r="230" fill="#FFFFFF" opacity="0.6" />

  <!-- Box Contour -->
  <g filter="url(#shadow4)">
    <rect x="160" y="210" width="280" height="200" rx="12" fill="url(#boxGrad)" stroke="#D4AF37" stroke-width="1.5" />
    <path d="M 160 210 L 300 270 L 440 210" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Label Overlay -->
  <rect x="210" y="240" width="180" height="140" rx="6" fill="#FDFBF7" />
  
  <text x="300" y="265" font-family="Georgia, serif" font-size="9" fill="#2E5A44" text-anchor="middle" letter-spacing="1.5">ARTISANAL CONFECTION</text>
  <line x1="230" y1="273" x2="370" y2="273" stroke="#D4AF37" stroke-width="1" />

  <text x="300" y="300" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">PROTEIN CRUNCH</text>
  <text x="300" y="320" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#2E5A44" text-anchor="middle">Box of 12 Bars</text>

  <rect x="240" y="338" width="120" height="26" rx="13" fill="#EAF2ED" />
  <text x="300" y="355" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2E5A44" text-anchor="middle">20g PROTEIN / BAR</text>
</svg>
